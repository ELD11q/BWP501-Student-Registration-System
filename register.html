<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إنشاء حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center min-vh-100">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">إنشاء حساب</h2>
                    <div id="message"></div>
                    <form id="registerForm" action="register.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label">اسم المستخدم</label>
                            <input type="text" name="username" class="form-control" dir="ltr" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" name="email" class="form-control" dir="ltr" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" name="password" id="password" class="form-control" dir="ltr" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تأكيد كلمة المرور</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" dir="ltr" required>
                            <div class="invalid-feedback">كلمتا المرور غير متطابقتين.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">إنشاء الحساب</button>
                    </form>
                    <p class="text-center mt-3 mb-0">عندك حساب؟ <a href="login.html">سجّل دخولك</a></p>
                    <p class="text-center mb-0"><a href="index.html">الرجوع للرئيسية</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
