<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Student Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none"><i class="bi bi-mortarboard-fill fs-1 text-primary"></i></a>
                        <h2 class="fw-bold mt-2">Login</h2>
                        <p class="text-muted">Sign in to manage student records</p>
                    </div>

                    <!-- Error / success messages (filled by assets/js/auth.js from the URL) -->
                    <div id="message" class="alert d-none" role="alert"></div>

                    <form id="loginForm" action="login.php" method="POST" novalidate>
                        <div class="mb-3">
                            <label for="login" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="login" name="login" required autocomplete="username">
                                <div class="invalid-feedback">Please enter your username or email.</div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                                <div class="invalid-feedback">Please enter your password.</div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
                    </form>

                    <p class="text-center mt-4 mb-0">Don't have an account? <a href="register.html">Register</a></p>
                    <p class="text-center mt-2 mb-0"><a href="index.html" class="text-muted small">&larr; Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
